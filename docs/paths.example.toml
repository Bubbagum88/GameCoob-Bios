# GameCoob paths file. Copy to \EFI\GameCoob\paths.toml on the EFI system
# partition (the FAT partition the firmware boots from). Every part is
# optional. Check it with:  gamecoob-launch check <file>
#
# Text goes in quotes. Use 'single quotes' for Windows paths so the
# backslashes stay as they are ("double quotes" treat \ as an escape).

# The boot app's own files on the ESP. These are the defaults.
[boot]
ipl = '\EFI\GameCoob\ipl.bin'      # your own console's IPL dump
cards = '\EFI\GameCoob\cards'      # memory card images: slot-a.raw, slot-b.raw
saves = '\EFI\GameCoob\saves'      # where the card explorer exports saves

# The OSes this PC boots. `boot` is text from the firmware boot entry's
# name (the boot menu sets BootNext to the first entry that contains it).
[[os]]
id = "windows"
kind = "windows"
boot = "Windows Boot Manager"

[[os]]
id = "arch"
kind = "linux"
boot = "Linux Boot Manager"        # systemd-boot; GRUB shows as "GRUB" or "arch"

# Emulators. `{rom}` in args becomes the game's path.
# Dolphin: -b quits Dolphin when the game stops, -e runs the file.
[[emulator]]
id = "dolphin-win"
name = "Dolphin"
os = "windows"
exe = 'C:\Program Files\Dolphin\Dolphin.exe'
args = ["-b", "-e", "{rom}"]
cards = 'C:\Users\you\Documents\Dolphin Emulator\GC'   # for card syncing (later)

[[emulator]]
id = "dolphin-arch"
name = "Dolphin"
os = "arch"
exe = "/usr/bin/dolphin-emu"
args = ["-b", "-e", "{rom}"]
cards = "/home/you/.local/share/dolphin-emu/GC"

# Folders of your own game dumps. GameCoob never ships games.
# ext defaults to iso, gcm, rvz, ciso, gcz, wbfs and dol.
[[roms]]
os = "windows"
path = 'D:\Games\GameCube'
emulator = "dolphin-win"
recursive = true

[[roms]]
os = "arch"
path = "/home/you/Games/GameCube"
emulator = "dolphin-arch"
ext = ["iso", "rvz"]
