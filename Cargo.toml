[package]
name = "gamecoob"
version = "0.1.0"
edition = "2024"

[dependencies]
libm = "0.2.16"
log = "0.4.34"
uefi = { version = "0.41", features = ["global_allocator", "panic_handler", "logger", "alloc"] }

[profile.dev]
opt-level = 2
panic = "abort"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
